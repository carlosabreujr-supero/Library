# MODELO: nao contem valores reais. Nao aplique como esta.
# Crie o Secret fora do Git, por exemplo:
#   kubectl create secret generic library-loans-api \
#     --from-literal=ConnectionStrings__Postgres='Host=<host>;Port=5432;Database=<db>;Username=<user>;Password=<senha>' \
#     --from-literal=ConnectionStrings__Redis='<host>:6379'
# Ou use External Secrets / Sealed Secrets / CSI Secret Store com o mesmo nome e chaves.
apiVersion: v1
kind: Secret
metadata:
  name: library-loans-api
  labels:
    app.kubernetes.io/name: library-loans-api
type: Opaque
stringData:
  ConnectionStrings__Postgres: "<PREENCHER: connection string do PostgreSQL>"
  ConnectionStrings__Redis: "<PREENCHER: host:porta do Redis>"
